
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master's Survey</title>

  <script>
    // Survey links (S4 temporarily excluded)
    const links = [
      "https://forms.gle/GMeimJPMngdSL6N56", // S1: 22 x H
      "https://forms.gle/2wUkD9VgWMyGDFuS6", // S2: 6 x L
      "https://forms.gle/nzCpU3xFkpR7MhLg8"  // S3: 22 x L
    ];

    // Randomly select one survey
    function randomRedirect() {
      const randomIndex = Math.floor(Math.random() * links.length);
      const chosenUrl = links[randomIndex];

      // Redirect to the selected survey
      window.location.replace(chosenUrl);
    }

    // Run when the page loads
    window.onload = randomRedirect;
  </script>
</head>

<body>
  <p style="font-family: Arial; text-align: center; margin-top: 100px;">
    Please wait. You are being directed to your assigned survey...
  </p>

  <p style="text-align: center;">
    If nothing happens,
    <a id="backup-link" href="#">click here</a>.
  </p>

  <script>
    // Backup link if automatic redirection does not work
    document.getElementById("backup-link").href = links[0];
  </script>
</body>
</html>
