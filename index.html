
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master's Survey</title>
</head>
<body>

    <p style="font-family: Arial; text-align: center; margin-top: 100px;">
        Please wait. You are being directed to your assigned survey...
    </p>

    <script>
        // Four Google Forms and their experimental conditions
       const surveys = [
    {
        condition: "22xH",
        url: "https://forms.gle/GMeimJPMngdSL6N56"
    },
    {
        condition: "6xL",
        url: "https://forms.gle/2wUkD9VgWMyGDFuS6"
    },
    {
        condition: "22xL",
        url: "https://forms.gle/nzCpU3xFkpR7MhLg8"
    }
];

        // Check whether this respondent already has an assignment
        let assignedSurvey = sessionStorage.getItem("assignedSurvey_v2");

        if (!assignedSurvey || !surveys.some(s => s.url === assignedSurvey)) {

            // Randomly select one of the four surveys
            const randomIndex = Math.floor(Math.random() * surveys.length);

            assignedSurvey = surveys[randomIndex].url;

            // Save the assignment for this browser tab session
            sessionStorage.setItem("assignedSurvey_v2", assignedSurvey);
        }

        // Redirect to the assigned Google Form
        window.location.replace(assignedSurvey);
    </script>

</body>
</html>
